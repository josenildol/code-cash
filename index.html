      function greet() {
        const name = prompt('Digite seu nome:');

        if (name === '') {
          return alert(
            'Olá! Seja bem vindo ao Code Cash.'
          );      
        } else if (name === null) {
          return alert ('Operação cancelada.');
        } else if (!isNaN(Number(name))) {
          alert('Digite um valor válido.');
          return greet();
        }
        
        alert(`Olá, ${name}! Seja bem vindo ao Code Cash.`);
      }

      greet();
